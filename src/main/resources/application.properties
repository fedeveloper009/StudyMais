spring.application.name=studymais
spring.profiles.default=dev
spring.config.import=optional:file:./.env[.properties],optional:file:./.env.local[.properties],optional:file:./studymais/.env[.properties],optional:file:./studymais/.env.local[.properties]

# Defina estas variaveis de ambiente com os dados de conexao do Supabase.
# Exemplo de DB_URL:
# jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Substitua o valor padrao em ambientes compartilhados/producao.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Separe varias origens por virgula quando necessario.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500}

# OAuth2 Google: nunca coloque credenciais diretamente neste arquivo.
# O valor fallback apenas permite iniciar a API sem OAuth configurado; nao e uma credencial.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# O callback do backend entrega o JWT ao frontend por query string (?token=...).
app.oauth2.frontend-success-url=${FRONTEND_OAUTH2_SUCCESS_URL:${FRONTEND_URL:http://localhost:3000}/oauth2/callback}
app.oauth2.frontend-failure-url=${FRONTEND_OAUTH2_FAILURE_URL:${FRONTEND_URL:http://localhost:3000}/oauth2/callback}
server.port=${PORT:8080}
server.address=0.0.0.0
